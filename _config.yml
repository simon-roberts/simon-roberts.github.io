# ---------------------------------------------------------------------------
# Site settings. Edit these first.
# ---------------------------------------------------------------------------
title: Simon Roberts
tagline: Consultant, Transportation and Industrials
description: >-
  Simon Roberts is a consultant at Oliver Wyman in Toronto, focused on rail and
  freight analytics and private equity due diligence across transportation and
  industrials.

# For a GitHub Pages *user site* the repo must be named <username>.github.io
# and this url must match. Change if you move to a custom domain.
url: "https://simon-roberts.github.io"
baseurl: ""

# ---------------------------------------------------------------------------
# Identity / contact
# ---------------------------------------------------------------------------
author:
  name: Simon Roberts
  role: Management consultant
  firm: Oliver Wyman
  location: Toronto
  # Named contact_email rather than email so jekyll-feed does not print it in
  # feed.xml. The site splits it so the full address is never in the HTML.
  contact_email: simonneilroberts@gmail.com
  linkedin: https://www.linkedin.com/in/simonnroberts
  headshot: /assets/img/simon-roberts-oliver-wyman-2025-small.jpg
  # PDF resume offered as a download. Delete this line to hide the buttons.
  resume: /assets/files/Simon_Roberts_Resume.pdf


# ---------------------------------------------------------------------------
# Build settings. Do not change unless you know why.
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:title/
timezone: America/Toronto

# The github-pages gem defaults to theme: jekyll-theme-primer when no theme
# is set, and that theme ships its own assets/css/style.css which collides
# with ours. Disable it explicitly.
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
    values:
      # Image for link previews (LinkedIn, Slack, iMessage). A page can
      # override it with its own image: in front matter.
      image: /assets/img/simon-roberts-oliver-wyman-2025-small.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache
