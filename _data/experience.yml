# ---------------------------------------------------------------------------
# Experience, as a list of groups rendered in order.
#
# Per group:
#   sublabel:  optional heading above the group (the first group has none)
#   compact:   true for the quieter, tighter treatment
#   items:     the roles, newest first
#
# Per role: dates, title, org, location are all optional.
#   notes:   a list of bullets  (used in the full treatment)
#   summary: one sentence       (used in the compact treatment)
#
# To add a group later, for example personal projects, copy the shape of the
# "International development" block below and give it a new sublabel.
# ---------------------------------------------------------------------------

