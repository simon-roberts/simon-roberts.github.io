- client: A U.S. transcontinental rail merger
  employer: Oliver Wyman
  title: Traffic study for an $85B proposed transaction
  summary: >-
    Contributed across multiple phases of the engagement and led full-cycle data
    analytics workstreams supporting rail-to-rail and truck-to-rail freight
    traffic studies, submitted to the Surface Transportation Board.
  outcome: >-
    The studies quantified diverted traffic valued north of $4B in support of
    the proposed transaction.
  tags: [Python, SQL, Network analysis, Econometrics, Regulatory]

- client: A U.S. car rental company
  employer: Oliver Wyman
  title: Warranty capture across a 400K-vehicle fleet
  summary: >-
    Isolated genuinely recoverable warranty spend from data-quality noise across
    a fleet of roughly 400,000 vehicles, set against a U.S. maintenance base of
    over $200M.
  outcome: Identified a $10M warranty capture savings opportunity.
  tags: [Databricks, SQL, Tableau, Data wrangling, Opportunity sizing]

